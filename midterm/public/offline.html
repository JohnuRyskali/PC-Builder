<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>Offline | PC Builder</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #121212; color: #f3f4f6; }
      body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #374151; border-radius: 12px; background: #1f2937; text-align: center; }
      h1 { margin-top: 0; }
      p { color: #d1d5db; }
      button, a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; box-sizing: border-box; margin: 8px; padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: white; font: inherit; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The connection is unavailable. Try again, or open the saved app shell.</p>
      <button type="button" onclick="window.location.reload()">Retry connection</button>
      <a href="./">Open PC Builder</a>
    </main>
  </body>
</html>
