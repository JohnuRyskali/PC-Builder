<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PC Builder</title>
    <script type="text/javascript">
      // Этот скрипт перехватывает 404 на GitHub Pages и передает путь в index.html через query-параметр
      var pathSegmentsToKeep = 1; // Указывает уровень вложенности (для /PC-Builder/ это 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
